appId: com.runnersHi
name: 응답 없음 - 15초 안에 오류 화면 (mockwire 필요)
---
- runScript: ../scripts/fault_timeout.js
- runFlow: ../subflows/launch_custom.yaml
- extendedWaitUntil:
    visible:
      id: error_view
    timeout: 40000
- runScript: ../scripts/fault_clear.js
- tapOn:
    id: retry_button
- extendedWaitUntil:
    visible:
      id: login_kakao
    timeout: 30000
